<html lang="pl">
<head>
    <meta charset="UTF-8">

    <title>Zamów Stronę | JuzekGuzek Web Designer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FAFAFB;
            --card-bg: #FFFFFF;
            --yellow: #FFCC00;
            --text-main: #111111;
            --text-muted: #555555;
            --border: #E5E5E5;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --theme-glow-1: rgba(255, 204, 0, 0.6);
            --theme-glow-2: rgba(255, 180, 0, 0.45);
            --theme-particle: rgba(255, 180, 0, 0.6);
            --theme-particle-shadow: rgba(255, 204, 0, 0.5);
            --green: #10B981;
            --red: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        body.no-scroll { overflow: hidden; }

        /* PRELOADER I TŁO */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .preloader-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; animation: pulseFade 1.5s infinite alternate ease-in-out; }
        @keyframes pulseFade { 0% { opacity: 0.6; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1.02); } }
        .loading-bar-wrapper { width: 200px; height: 4px; background: var(--border); border-radius: 10px; overflow: hidden; position: relative; }
        .loading-bar-fill { height: 100%; width: 0%; background: var(--yellow); border-radius: 10px; animation: loadProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes loadProgress { 0% { width: 0%; } 40% { width: 60%; } 100% { width: 100%; } }

        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background-color: #FAFAFB; overflow: hidden; }
        .bg-animation::before, .bg-animation::after { content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%; filter: blur(80px); opacity: 0.35; animation: glowMove 12s ease-in-out infinite alternate; }
        .bg-animation::before { background: var(--theme-glow-1); top: -100px; left: -100px; }
        .bg-animation::after { background: var(--theme-glow-2); bottom: -100px; right: -100px; animation-delay: -6s; animation-duration: 15s; }
        @keyframes glowMove { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(250px, 150px) scale(1.2); } 100% { transform: translate(100px, 300px) scale(0.9); } }
        .particle { position: absolute; background: var(--theme-particle); border-radius: 50%; box-shadow: 0 0 6px var(--theme-particle-shadow); animation: rain linear infinite; }
        @keyframes rain { 0% { transform: translateY(-50px); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateY(105vh); opacity: 0; } }

        /* HEADER */
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(250, 250, 251, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 8%; z-index: 1000; }
        .logo { text-decoration: none; display: flex; align-items: center; gap: 10px; justify-self: start; }
        .navbar-center { justify-self: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 0.9rem; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; background: rgba(255, 204, 0, 0.15); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255, 204, 0, 0.3); }
        .logo-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.5px; }
        .logo-badge { font-family: 'JetBrains Mono', monospace; background: var(--yellow); color: #111; font-weight: 700; font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; }
        nav { justify-self: end; }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--text-main); }

        /* SEKCJA ZAMÓWIENIA */
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 140px 8% 80px 8%; max-width: 1300px; margin: 0 auto; }
        .section-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; }
        .section-title span { background: var(--yellow); color: #111; padding: 0 6px; border-radius: 4px; }
        
        .btn-primary, button.btn-primary { display: inline-block; background: var(--text-main); color: #FFFFFF; padding: 16px 32px; font-weight: 700; font-size: 0.95rem; text-decoration: none; border-radius: 10px; transition: background 0.2s, transform 0.2s; cursor: pointer; border: none; font-family: inherit; }
        .btn-primary:hover, button.btn-primary:hover { background: var(--yellow); color: var(--text-main); transform: translateY(-2px); }
        .btn-secondary, button.btn-secondary { display: inline-block; background: #FFFFFF; color: var(--text-main); border: 1px solid var(--border); padding: 16px 32px; font-weight: 700; font-size: 0.95rem; text-decoration: none; border-radius: 10px; transition: border-color 0.2s, transform 0.2s; cursor: pointer; font-family: inherit; }
        .btn-secondary:hover, button.btn-secondary:hover { border-color: var(--text-main); transform: translateY(-2px); }

        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .pricing-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04); transition: all 0.3s ease; display: flex; flex-direction: column; }
        .pricing-card:hover { transform: translateY(-6px); border-color: var(--yellow); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); }
        .pricing-card h3 { font-size: 1.6rem; margin-bottom: 15px; font-weight: 800; }
        .pricing-card .price { font-size: 2.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
        .pricing-card .price span { font-size: 1.2rem; color: var(--text-muted); font-family: 'Plus Jakarta Sans', sans-serif; }
        .price-note { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.3; font-style: italic; }
        .pricing-card ul { list-style: none; margin-bottom: 30px; text-align: left; flex-grow: 1; }
        .pricing-card ul li { margin-bottom: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
        .pricing-card ul li::before { content: '✓'; color: #10b981; font-weight: 800; background: rgba(16, 185, 129, 0.15); padding: 2px 6px; border-radius: 50%; font-size: 0.8rem; }
        .pricing-card button { width: 100%; }

        .order-form-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: none; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04); animation: fadeIn 0.5s ease; margin-bottom: 60px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-main); }
        .form-group input, .form-group textarea { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-family: inherit; color: var(--text-main); font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--yellow); }

        .selected-package-info { background: rgba(255, 204, 0, 0.15); border: 1px solid rgba(255, 204, 0, 0.3); padding: 16px; border-radius: 12px; margin-bottom: 25px; font-weight: 700; text-align: center; font-size: 1.1rem; }

        /* KARTA POTWIERDZENIA ZAMÓWIENIA */
        .confirmation-card {
            background: var(--card-bg);
            border: 2px solid var(--green);
            border-radius: 20px;
            padding: 40px;
            display: none;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.1);
            animation: fadeIn 0.5s ease;
            margin-bottom: 60px;
        }
        .confirmation-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .confirmation-icon {
            width: 48px;
            height: 48px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            flex-shrink: 0;
        }
        .confirmation-title {
            font-size: 1.6rem;
            font-weight: 800;
        }
        .summary-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            overflow: hidden;
        }
        .summary-item {
            margin-bottom: 12px;
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .summary-item:last-child { margin-bottom: 0; }
        .summary-item strong {
            color: var(--text-main);
            font-weight: 700;
        }
        .notice-box {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        @media(max-width: 900px) {
            .pricing-grid { grid-template-columns: 1fr; }
            header { grid-template-columns: 1fr auto; }
            .navbar-center, nav ul { display: none; }
        }
    </style>

<style>
/* ============================================================
   JUZEKGUZEK — LIQUID GLASS THEME v2 (iOS-style)
   Czysta warstwa wizualna. Treść i logika bez zmian.
   ============================================================ */

:root {
    --bg: #06060a;
    --card-bg: rgba(255, 255, 255, 0.04);
    --yellow: #7C6CFF;
    --yellow-hover: #22D3EE;
    --text-main: #F7F8FC;
    --text-muted: rgba(233, 238, 252, 0.60);
    --border: rgba(255, 255, 255, 0.10);
    --shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    --theme-glow-1: #7C6CFF;
    --theme-glow-2: #22D3EE;
    --theme-particle: rgba(210, 220, 255, 0.6);
    --theme-particle-shadow: #7C6CFF;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(255, 255, 255, 0.085);
    --hairline: rgba(255, 255, 255, 0.12);
    --accent: #7C6CFF;
    --accent-2: #22D3EE;
    --radius: 28px;
    --ease: cubic-bezier(.16, 1, .3, 1);
}

html { color-scheme: dark; scroll-behavior: smooth; }

body {
    background-color: var(--bg) !important;
    color: var(--text-main) !important;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
}

@media (pointer: fine) {
    html.lg-cursor, html.lg-cursor * { cursor: none !important; }
}

/* ---------- Żywe tło: mesh orby + siatka + ziarno ---------- */
.bg-animation { background-color: var(--bg) !important; }
.bg-animation::before,
.bg-animation::after {
    width: 900px !important;
    height: 900px !important;
    filter: blur(140px) !important;
    opacity: 0.5 !important;
}
.bg-animation::before { background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%) !important; }
.bg-animation::after  { background: radial-gradient(circle at 70% 70%, var(--accent-2), transparent 72%) !important; }

body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(760px circle at var(--mx, 70%) var(--my, 12%), color-mix(in oklab, var(--accent-2) 18%, transparent), transparent 60%),
        radial-gradient(640px circle at 10% 85%, color-mix(in oklab, var(--accent) 20%, transparent), transparent 62%),
        linear-gradient(180deg, rgba(6,6,10,0) 0%, rgba(6,6,10,0.9) 100%);
    transition: background-position .3s linear;
}
body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.32;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 68px 68px;
    mask-image: radial-gradient(circle at 50% 25%, #000 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 25%, #000 0%, transparent 80%);
    animation: gridDrift 26s linear infinite;
}
@keyframes gridDrift { to { background-position: 68px 68px, 68px 68px; } }

.particle {
    background: var(--theme-particle) !important;
    box-shadow: 0 0 12px var(--theme-particle-shadow) !important;
}

/* ---------- Custom cursor ---------- */
.lg-cursor-dot, .lg-cursor-ring {
    position: fixed;
    top: 0; left: 0;
    z-index: 2147483000;
    pointer-events: none;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .3s ease;
}
.lg-cursor-dot {
    width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px;
    background: #fff;
    box-shadow: 0 0 14px color-mix(in oklab, var(--accent) 80%, transparent);
}
.lg-cursor-ring {
    width: 40px; height: 40px;
    margin: -20px 0 0 -20px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px) saturate(160%);
    transition: width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease),
                background .35s ease, border-color .35s ease, opacity .3s ease;
}
html.lg-ready .lg-cursor-dot, html.lg-ready .lg-cursor-ring { opacity: 1; }
html.lg-hover .lg-cursor-ring {
    width: 74px; height: 74px; margin: -37px 0 0 -37px;
    background: color-mix(in oklab, var(--accent) 22%, transparent);
    border-color: color-mix(in oklab, var(--accent) 70%, transparent);
}
html.lg-down .lg-cursor-ring { width: 28px; height: 28px; margin: -14px 0 0 -14px; }

/* ---------- Preloader + przejścia stron ---------- */
#preloader { background: var(--bg) !important; }
.loading-bar-wrapper { background: rgba(255,255,255,0.08) !important; }
.loading-bar-fill { background: linear-gradient(90deg, var(--accent), var(--accent-2)) !important; }

.lg-transition {
    position: fixed;
    inset: 0;
    z-index: 2147482000;
    pointer-events: none;
    background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 85%, #06060a), color-mix(in oklab, var(--accent-2) 85%, #06060a));
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform .55s var(--ease);
}
.lg-transition.is-out { transform: scaleY(1); transform-origin: bottom; }

.lg-progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    z-index: 2147482500;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px color-mix(in oklab, var(--accent) 70%, transparent);
    pointer-events: none;
}

/* ---------- Pływający szklany header ---------- */
header {
    top: 16px !important;
    left: 50% !important;
    transform: translateX(-50%) translateY(0);
    width: calc(100% - 40px) !important;
    max-width: 1240px;
    padding: 13px 24px !important;
    border-radius: 999px !important;
    background: rgba(255, 255, 255, 0.05) !important;
    backdrop-filter: blur(30px) saturate(190%) !important;
    -webkit-backdrop-filter: blur(30px) saturate(190%) !important;
    border: 1px solid var(--hairline) !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.16);
    transition: transform .5s var(--ease), background .4s ease, box-shadow .4s ease, padding .4s var(--ease);
    animation: headerDrop 1s var(--ease) both .15s;
}
@keyframes headerDrop { from { opacity: 0; transform: translateX(-50%) translateY(-26px); } }
header.lg-hidden { transform: translateX(-50%) translateY(-140%); }
header.lg-scrolled {
    padding: 9px 22px !important;
    background: rgba(255,255,255,0.075) !important;
    box-shadow: 0 26px 70px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2);
}
header::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 44%);
}

.logo-text { color: var(--text-main) !important; }
.logo-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
    color: #06060a !important;
    box-shadow: 0 8px 24px color-mix(in oklab, var(--accent) 45%, transparent);
    border-radius: 9px !important;
}
.navbar-center, .visit-counter-badge {
    background: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid var(--hairline) !important;
    color: rgba(233,238,252,0.72) !important;
    backdrop-filter: blur(14px);
}
nav ul { gap: 22px !important; }
nav a {
    color: var(--text-muted) !important;
    position: relative;
    transition: color .3s ease !important;
}
nav a::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .4s var(--ease);
}
nav a:hover::after, nav a.active::after { transform: scaleX(1); transform-origin: left; }
nav a:hover, nav a.active { color: #fff !important; }

/* ---------- Typografia ---------- */
.section-title, .page-title {
    letter-spacing: -1.4px !important;
    background: linear-gradient(180deg, #ffffff 20%, rgba(255,255,255,0.58) 100%);
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
}
.section-title span, .page-title span, .hero h1 span {
    background: linear-gradient(110deg, var(--accent), var(--accent-2), var(--accent)) !important;
    background-size: 220% auto !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    padding: 0 !important;
    animation: shimmer 6s linear infinite;
}
@keyframes shimmer { to { background-position: 220% center; } }
.subtitle, .page-header p { color: var(--text-muted) !important; }

/* ---------- Hero ---------- */
.hero h1, #home h1 { letter-spacing: -2.4px !important; }
.hero-tag, .badge {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid var(--hairline) !important;
    color: rgba(233,238,252,0.86) !important;
    border-radius: 999px !important;
    padding: 8px 18px !important;
    backdrop-filter: blur(14px);
    position: relative;
    overflow: hidden;
}
.hero-tag::after, .badge::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.28) 50%, transparent 80%);
    transform: translateX(-120%);
    animation: sweep 4.5s var(--ease) infinite;
}
@keyframes sweep { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.typing-box { color: var(--accent-2) !important; }

/* ---------- Szkło: karty ---------- */
.stat-card, .info-card, .project-card, .pricing-card, .order-card,
.confirmation-card, .feature-card, .main-card, .preview-section,
.order-form-container, .summary-box, .notice-box, .empty-state,
.selected-package-info, .request-card, .status-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.085), rgba(255,255,255,0.03)) !important;
    border: 1px solid var(--hairline) !important;
    border-radius: var(--radius) !important;
    backdrop-filter: blur(34px) saturate(170%);
    -webkit-backdrop-filter: blur(34px) saturate(170%);
    box-shadow: 0 24px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14) !important;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform .5s var(--ease), border-color .4s ease, box-shadow .5s var(--ease);
}

/* liquid sheen + spotlight kursora */
.stat-card::after, .info-card::after, .project-card::after, .pricing-card::after,
.order-card::after, .feature-card::after, .main-card::after, .request-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
        radial-gradient(340px circle at var(--px, 50%) var(--py, 0%), color-mix(in oklab, var(--accent) 20%, transparent), transparent 65%),
        linear-gradient(125deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 40%);
    opacity: .85;
    transition: opacity .4s ease;
}

.stat-card:hover, .info-card:hover, .project-card:hover,
.pricing-card:hover, .order-card:hover, .feature-card:hover, .request-card:hover {
    border-color: color-mix(in oklab, var(--accent) 55%, transparent) !important;
    box-shadow: 0 40px 90px rgba(0,0,0,0.62),
                0 0 0 1px color-mix(in oklab, var(--accent) 28%, transparent),
                0 0 60px color-mix(in oklab, var(--accent) 26%, transparent),
                inset 0 1px 0 rgba(255,255,255,0.2) !important;
}

.info-card::before { background: linear-gradient(180deg, var(--accent), var(--accent-2)) !important; }
.info-icon, .feature-icon, .confirmation-icon {
    background: color-mix(in oklab, var(--accent) 18%, transparent) !important;
    border: 1px solid color-mix(in oklab, var(--accent) 38%, transparent) !important;
    border-radius: 18px !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 10px 30px rgba(0,0,0,0.35);
    transition: transform .5s var(--ease);
}
