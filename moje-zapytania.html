<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Zapytania | JuzekGuzek Web Designer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FAFAFB;
            --card-bg: #FFFFFF;
            --yellow: #FFCC00;
            --text-main: #111111;
            --text-muted: #555555;
            --border: #E5E5E5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(250, 250, 251, 0.85); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; 
            padding: 20px 8%; z-index: 1000; 
        }
        .logo { text-decoration: none; display: flex; align-items: center; gap: 10px; justify-self: start; }
        .navbar-center { 
            justify-self: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; 
            font-size: 0.9rem; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; 
            background: rgba(255, 204, 0, 0.15); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255, 204, 0, 0.3); 
        }
        .logo-text { font-weight: 800; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.5px; }
        .logo-badge { font-family: 'JetBrains Mono', monospace; background: var(--yellow); color: #111; font-weight: 700; font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; }
        nav { justify-self: end; }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--text-main); }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 140px 8% 80px 8%;
        }

        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        .page-title span { background: var(--yellow); padding: 0 6px; border-radius: 4px; }

        .orders-list { display: flex; flex-direction: column; gap: 20px; }

        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.2s, border-color 0.2s;
            overflow: hidden;
        }

        .order-card:hover {
            transform: translateY(-2px);
            border-color: var(--yellow);
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            background: rgba(255, 204, 0, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .order-date {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 18px;
        }

        .detail-item strong {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .detail-item span { 
            font-weight: 700; 
            font-size: 1rem; 
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .order-desc {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-muted);
            white-space: pre-line;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 20px;
        }

        .empty-state h3 { font-size: 1.4rem; margin-bottom: 10px; }
        .empty-state p { color: var(--text-muted); margin-bottom: 25px; }

        .btn-primary {
            display: inline-block;
            background: var(--text-main);
            color: #FFF;
            padding: 14px 28px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--yellow); color: var(--text-main); }

        @media(max-width: 900px) {
            header { grid-template-columns: 1fr auto; }
            .navbar-center, nav ul { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span class="logo-text">JuzekGuzek</span>
            <span class="logo-badge">WEB DESIGNER</span>
        </a>
        
        <div class="navbar-center">Moje Zapytania</div>

        <nav>
            <ul>
                <li><a href="index.html#home">Start</a></li>
                <li><a href="index.html#info">Informacje</a></li>
                <li><a href="index.html#works">Realizacje</a></li>
                <li><a href="zamowienia.html">Zamów stronę</a></li>
                <li><a href="moje-zapytania.html" class="active" style="color: var(--text-main);">Moje zapytania</a></li>
                <li><a href="index.html#contact">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Moje <span>zapytania</span></h1>
            <p style="color: var(--text-muted);">Lista wysłanych przez Ciebie zapytań z tej przeglądarki.</p>
        </div>

        <div id="orders-container" class="orders-list"></div>
    </main>

    <script>
        function loadOrders() {
            const container = document.getElementById('orders-container');
            const orders = JSON.parse(localStorage.getItem('juzek_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Brak wysłanych zapytań</h3>
                        <p>Nie złożyłeś jeszcze żadnego zapytania o stronę WWW.</p>
                        <a href="zamowienia.html" class="btn-primary">Zamów stronę teraz</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-head">
                        <span class="order-id">#${order.id}</span>
                        <span class="order-date">Wysłano: ${order.date}</span>
                    </div>
                    <div class="order-details">
                        <div class="detail-item">
                            <strong>Pakiet</strong>
                            <span>${order.package}</span>
                        </div>
                        <div class="detail-item">
                            <strong>E-mail</strong>
                            <span>${order.email}</span>
                        </div>
                        <div class="detail-item">
                            <strong>Typ strony</strong>
                            <span>${order.type}</span>
                        </div>
                    </div>
                    <div class="order-desc">
                        <strong style="display:block; margin-bottom: 6px; color: var(--text-main);">Opis:</strong>
                        ${order.description}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
